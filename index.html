<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【27卒対象】学内業界研究セミナー | 多摩大学</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0056b3;
            --primary-dark: #003d80;
            --accent: #f57c00;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #333333;
            --text-light: #666666;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shonan-color: #d32f2f; 
            --intl-color: #2e7d32;
            --tama-color: #0288d1;
            /* 鷹の目視点（Hawkeye）用カラー */
            --hawkeye-bg: #e3f2fd;
            --hawkeye-text: #01579b;
            --hawkeye-border: #0288d1;
        }

        * { box-sizing: border-box; }
        body {
            font-family: 'Noto Sans JP', sans-serif;
            margin: 0; padding: 0;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* --- ヘッダー --- */
        header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 2.5rem 1.5rem 4.5rem 1.5rem;
            text-align: center;
        }
        .header-tag {
            background-color: rgba(255, 255, 255, 0.2);
            padding: 0.25rem 1rem;
            border-radius: 50px;
            font-size: 0.9rem;
            display: inline-block;
            margin-bottom: 1rem;
        }
        header h1 { margin: 0; font-size: 1.8rem; font-weight: 700; line-height: 1.4; }

        /* --- 予約ボタンエリア --- */
        .reserve-area {
            max-width: 1000px;
            margin: -2.5rem auto 2rem auto;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            position: relative;
            z-index: 20;
        }
        .btn-reserve {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            transition: transform 0.2s;
            text-align: center;
        }
        .btn-reserve:hover { transform: translateY(-3px); opacity: 0.9; }
        .btn-tama { background: white; color: var(--tama-color); border: 2px solid var(--tama-color); }
        .btn-shonan { background: white; color: var(--shonan-color); border: 2px solid var(--shonan-color); }
        .btn-reserve .campus-name { font-size: 0.8rem; opacity: 0.8; }
        .btn-reserve .btn-label { font-size: 1.1rem; }

        /* --- タブ --- */
        .tabs-container { max-width: 1000px; margin: 0 auto 1.5rem auto; padding: 0 1rem; }
        .tabs { display: flex; justify-content: center; gap: 0.4rem; overflow-x: auto; padding-bottom: 10px; }
        .tab-btn {
            background: #e0e0e0;
            border: none;
            border-radius: 50px;
            padding: 0.6rem 1.2rem;
            font-size: 0.9rem;
            font-weight: bold;
            color: #666;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.3s;
        }
        .tab-btn.active { background: var(--accent); color: white; box-shadow: 0 4px 10px rgba(245, 124, 0, 0.3); }

        /* --- コンテンツ --- */
        .container { max-width: 1000px; margin: 0 auto; padding: 0 1.5rem 3rem 1.5rem; }
        .section-box { background: white; border-radius: 16px; padding: 1.5rem; margin-bottom: 2rem; box-shadow: var(--shadow); }
        h2.section-title { font-size: 1.2rem; color: var(--primary); border-left: 5px solid var(--accent); padding-left: 1rem; margin-top: 0; margin-bottom: 1rem; }

        .timeline { position: relative; border-left: 2px solid #eee; margin-left: 10px; padding-left: 20px; }
        .timeline-item { margin-bottom: 1rem; font-size: 0.95rem; }
        .timeline-time { font-weight: bold; color: var(--primary); margin-right: 10px; }

        /* --- 企業グリッド --- */
        .company-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; }
        .card {
            background: white; border-radius: 12px; padding: 1.5rem; border: 1px solid #eee; box-shadow: var(--shadow);
            cursor: pointer; transition: 0.3s; display: flex; flex-direction: column; position: relative;
        }
        .card:hover { transform: translateY(-5px); border-color: var(--primary); box-shadow: 0 8px 15px rgba(0,0,0,0.1); }
        
        /* 鷹の目視点（Hawkeye View）追加スタイル */
        .hawkeye-tip {
            margin-top: 10px;
            font-size: 0.8rem;
            background-color: var(--hawkeye-bg);
            color: var(--hawkeye-text);
            padding: 8px 12px;
            border-radius: 8px;
            border-left: 4px solid var(--hawkeye-border);
            line-height: 1.4;
        }
        .hawkeye-tip::before {
            content: "🦅 鷹の目視点：プロの注目ポイント";
            font-weight: bold;
            display: block;
            margin-bottom: 2px;
            font-size: 0.75rem;
        }

        .industry-label { font-size: 0.7rem; font-weight: bold; background: #f0f2f5; padding: 3px 8px; border-radius: 4px; align-self: flex-start; margin-bottom: 0.5rem; }
        .company-name { font-size: 1.2rem; font-weight: bold; color: var(--primary); margin-bottom: 0.5rem; }
        .badge { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; font-weight: bold; margin-right: 4px; }
        .badge-ob { background: #fff8e1; color: #b7791f; border: 1px solid #f6e05e; }
        .badge-intl { background: #e8f5e9; color: var(--intl-color); border: 1px solid #a5d6a7; }

        /* --- モーダル --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7);
            display: flex; align-items: center; justify-content: center; z-index: 1000;
            opacity: 0; visibility: hidden; transition: 0.3s; padding: 1rem;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-container { background: white; width: 100%; max-width: 600px; border-radius: 16px; overflow: hidden; max-height: 90vh; display: flex; flex-direction: column; }
        
        .modal-campus-info { padding: 1rem 1.5rem; color: white; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        .info-tama { background: var(--tama-color); }
        .info-shonan { background: var(--shonan-color); }

        .modal-header { padding: 1.5rem; border-bottom: 1px solid #eee; }
        .modal-body { padding: 1.5rem; overflow-y: auto; }
        .detail-item { margin-bottom: 1.2rem; }
        .detail-label { font-weight: bold; color: var(--accent); font-size: 0.9rem; margin-bottom: 0.3rem; display: block; }
        .detail-content { font-size: 0.95rem; white-space: pre-wrap; margin: 0; }

        .modal-footer { padding: 1.2rem; border-top: 1px solid #eee; text-align: center; background: #f9f9f9; }
        .btn-hp { display: inline-block; background: var(--primary); color: white; padding: 0.6rem 2rem; border-radius: 50px; text-decoration: none; font-weight: bold; }

        /* --- 全社検索・一覧 --- */
        .all-list-section { margin-top: 3rem; background: white; padding: 2rem; border-radius: 16px; box-shadow: var(--shadow); }
        .filter-box { display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; align-items: center; }
        .search-input { flex: 1; min-width: 200px; padding: 0.6rem; border: 1px solid #ccc; border-radius: 8px; }
        .select-input { padding: 0.6rem; border: 1px solid #ccc; border-radius: 8px; background: white; }
        .intl-filter-label { font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; gap: 0.4rem; background: #f8f9fa; padding: 0.5rem 0.8rem; border-radius: 8px; border: 1px solid #ccc; }
        
        .all-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        .all-table th, .all-table td { padding: 12px; border-bottom: 1px solid #eee; text-align: left; }
        .all-table th { background: #f8f9fa; color: #666; font-weight: bold; }
        .all-table tr:hover { background: #f1f7ff; cursor: pointer; }

        .date-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            color: white;
            background-color: #999;
            white-space: nowrap;
        }
        .date-badge.d-04 { background-color: var(--primary); }
        .date-badge.d-05 { background-color: #00897b; }
        .date-badge.d-09 { background-color: var(--shonan-color); }
        .date-badge.d-10 { background-color: #f57c00; }
        .date-badge.d-25 { background-color: #7b1fa2; }
        .date-badge.d-26 { background-color: #c2185b; }

        .intl-mark { color: var(--intl-color); font-weight: bold; font-size: 1.1rem; }

        @media (max-width: 600px) {
            .reserve-area { grid-template-columns: 1fr; }
            header h1 { font-size: 1.4rem; }
            .company-grid { grid-template-columns: 1fr; }
            .all-table th:nth-child(2), .all-table td:nth-child(2) { display: none; }
        }

        .hidden { display: none; }
    </style>
</head>

        dayInfo.innerHTML = `【多摩大学 ${c.name}】　${c.dress}　${c.time}`;

        document.getElementById('timeline').innerHTML = c.timeline.map(item => `
            <div class="timeline-item"><span class="timeline-time">${item.t}</span> ${item.e}</div>
        `).join('');

        const grid = document.getElementById('company-grid');
        currentDayList = seminarData[date] || [];
        grid.innerHTML = currentDayList.length ? currentDayList.map((comp, idx) => `
            <div class="card" onclick="openModalFromDay(${idx})">
                <span class="industry-label">${comp.industry}</span>
                <div class="company-name">${comp.name}</div>
                <div style="margin-bottom:0.5rem;">
                    ${comp.alumni > 0 ? `<span class="badge badge-ob">多摩大OB実績あり</span>` : ''}
                    ${comp.international ? `<span class="badge badge-intl">留学生歓迎</span>` : ''}
                </div>
                <div class="hawkeye-tip">
                    ${comp.hawkeye || "プロの視点で分析中。当日会場で詳細を聞こう！"}
                </div>
                <div style="text-align:right; margin-top:1rem; color:var(--primary); font-size:0.8rem; font-weight:bold;">詳細を見る →</div>
            </div>
        `).join('') : '<div style="grid-column:1/-1; text-align:center; padding:3rem; color:#999;">データ準備中</div>';
    }

    window.openModalFromDay = function(idx) { openModal(currentDayList[idx]); }
    window.openModalFromList = function(idx) { openModal(currentFilteredList[idx]); }

    function openModal(comp) {
        if (!comp) return;
        const c = config[comp.campus];
        const bar = document.getElementById('modal-campus-bar');
        bar.className = "modal-campus-info " + c.color;
        document.getElementById('modal-campus-name').innerText = "📍 " + c.name + " (" + c.time + ")";
        document.getElementById('modal-dress-code').innerText = "👔 " + c.dress;

        document.getElementById('modal-name').innerText = comp.name;
        document.getElementById('modal-industry').innerText = comp.industry;
        document.getElementById('modal-business').innerText = comp.business || "会場にて説明";
        document.getElementById('modal-person').innerText = comp.person || "会場にて説明";
        document.getElementById('modal-pr').innerText = comp.pr || "";
        document.getElementById('modal-job').innerText = comp.job ? `【職種】${comp.job}\n【勤務地】${comp.location}` : "会場にて説明";
        
        document.getElementById('modal-badges').innerHTML = (comp.alumni > 0 ? `<span class="badge badge-ob" style="font-size:0.85rem; padding:4px 10px;">多摩大OB在籍実績あり</span>` : '') + (comp.international ? `<span class="badge badge-intl" style="font-size:0.85rem; padding:4px 10px;">留学生歓迎</span>` : '');
        document.getElementById('modal-link').href = `https://www.google.com/search?q=${comp.name}+採用`;
        document.getElementById('modal').classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function closeModal() { document.getElementById('modal').classList.remove('active'); document.body.style.overflow = 'auto'; }

    function initAllCompanies() {
        const industrySet = new Set();
        allCompaniesFlat = [];
        Object.keys(seminarData).forEach(date => {
            const dateStr = date.slice(5).replace('-','/');
            const dow = (date.includes("04") || date.includes("25")) ? "(水)" : (date.includes("05") || date.includes("26")) ? "(木)" : date.includes("09") ? "(月)" : "(火)";
            const dateClass = "d-" + date.slice(8);
            seminarData[date].forEach(comp => {
                allCompaniesFlat.push({ ...comp, dateLabel: `${dateStr}${dow}`, dateClass: dateClass });
                industrySet.add(comp.industry);
            });
        });
        const filter = document.getElementById('industry-filter');
        Array.from(industrySet).sort().forEach(ind => {
            const opt = document.createElement('option'); opt.value = ind; opt.innerText = ind; filter.appendChild(opt);
        });
        filterList();
    }

    window.filterList = function() {
        const keyword = document.getElementById('search-input').value.toLowerCase();
        const industry = document.getElementById('industry-filter').value;
        const intlOnly = document.getElementById('intl-filter').checked;
        currentFilteredList = allCompaniesFlat.filter(c => 
            (c.name.toLowerCase().includes(keyword) || (c.catchphrase && c.catchphrase.toLowerCase().includes(keyword))) &&
            (industry === "" || c.industry === industry) && (!intlOnly || c.international)
        );
        const body = document.getElementById('all-companies-body');
        body.innerHTML = currentFilteredList.length ? currentFilteredList.map((c, idx) => `
            <tr onclick="openModalFromList(${idx})">
                <td><span class="date-badge ${c.dateClass}">${c.dateLabel}</span></td>
                <td>${c.industry}</td><td style="font-weight:bold; color:var(--primary);">${c.name}</td>
                <td style="text-align:center;">${c.international ? '<span class="intl-mark">◎</span>' : ''}</td>
            </tr>
        `).join('') : '<tr><td colspan="4" style="text-align:center; padding:2rem;">見つかりませんでした</td></tr>';
    }

    window.onload = function() { switchDate('2026-02-04'); initAllCompanies(); };
</script>
</body>
</html>
